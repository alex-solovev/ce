<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>custom-elements</title>
    <script type="module" src="/src/hello-world.js"></script>
    <script type="module" src="/src/ce-input.js"></script>
    <script type="module" src="/src/ce-icon.js"></script>
  </head>
  <body>
    <p><hello-world></hello-world></p>
    <p><hello-world name="custom elements"></hello-world></p>

    <h2>ce-input</h2>
    <form id="demo">
      <p>
        <label for="first">First name</label>
        <ce-input id="first" name="first" placeholder="Ada"></ce-input>
      </p>
      <p>
        <label>Last name <ce-input name="last" value="Lovelace"></ce-input></label>
      </p>
      <p>
        <label>Disabled <ce-input name="skipped" value="not submitted" disabled></ce-input></label>
      </p>
      <fieldset id="group">
        <legend>Fieldset</legend>
        <label>City <ce-input name="city" value="London"></ce-input></label>
      </fieldset>
      <p>
        <label><input type="checkbox" id="toggle-group" /> Disable fieldset</label>
      </p>
      <p>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
      </p>
    </form>
    <p>Submitted: <output id="result" form="demo"></output></p>

    <h2>ce-icon</h2>
    <p id="default-icons"></p>
    <p style="font-size: 2rem; color: crimson">
      <ce-icon name="check" label="Done"></ce-icon> Larger and colored, labeled "Done"
    </p>
    <p>
      <ce-icon library="shapes" name="square"></ce-icon>
      <ce-icon library="shapes" name="circle"></ce-icon>
      Custom library
      <button type="button" id="register-shapes">Register "shapes"</button>
    </p>

    <script type="module">
      const form = document.querySelector("#demo");
      const result = document.querySelector("#result");
      const group = document.querySelector("#group");

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        result.value = new URLSearchParams(new FormData(form)).toString();
      });

      document.querySelector("#toggle-group").addEventListener("change", (event) => {
        group.disabled = event.target.checked;
      });
    </script>

    <script type="module">
      import { defaultIcons } from "/src/icon-library-default.js";
      import { registerIconLibrary } from "/src/icon-library.js";

      const defaultIconsRow = document.querySelector("#default-icons");

      for (const name of Object.keys(defaultIcons)) {
        const icon = document.createElement("ce-icon");
        icon.name = name;
        icon.title = name;
        defaultIconsRow.append(icon, " ");
      }

      // Icons above render once their library is registered.
      document.querySelector("#register-shapes").addEventListener("click", () => {
        registerIconLibrary("shapes", {
          square: `<svg viewBox="0 0 10 10" fill="currentColor"><rect width="10" height="10" /></svg>`,
          circle: `<svg viewBox="0 0 10 10" fill="currentColor"><circle cx="5" cy="5" r="5" /></svg>`,
        });
      });
    </script>
  </body>
</html>
